<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d38"><link rel="manifest" href="manifest.webmanifest">
<title>MY SPACE</title>
<style>
:root{--n:#101d38;--n2:#1d3152;--ice:#dceaf4;--cream:#f5f0e6;--silver:#bfd0dc;--line:#dceaf43d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 18% 0%,#3a5575 0,transparent 36%),linear-gradient(145deg,#0a1428,#172944 62%,#263d59);background-attachment:fixed}
button,input,textarea,select{font:inherit}button{cursor:pointer}.snow{position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(2px 2px at 12% 22%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 76% 18%,#fff 98%,transparent),radial-gradient(2px 2px at 45% 72%,#fff 98%,transparent);background-size:180px 180px}
.shell{max-width:1100px;margin:auto;padding:18px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font:24px Georgia,serif;letter-spacing:3px;color:#e6eef5}.topright{display:flex;gap:8px}.iconbtn,.navbtn,.btn,.soft{border:1px solid var(--line);background:#dceaf410;color:#edf4f8;border-radius:12px;padding:10px 13px}.iconbtn{border-radius:50%;width:42px;height:42px;padding:0}.layout{display:grid;grid-template-columns:205px 1fr;gap:16px}.sidebar,.panel{background:linear-gradient(145deg,#e6f2fa20,#e6f2fa09);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:20px;box-shadow:0 15px 40px #050b1844}.sidebar{padding:12px;height:max-content;position:sticky;top:12px}.navbtn{width:100%;text-align:right;margin:4px 0;border-color:transparent}.navbtn.active{background:#dceaf426;border-color:#c9dbe755}.main{min-width:0}.panel{padding:18px;margin-bottom:14px}.hero{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}.hero h1{font-size:21px;margin:0}.muted{font-size:12px;color:#c1d1de;line-height:1.9}.chart{height:12px;background:#d9e8f21c;border-radius:20px;overflow:hidden;margin:18px 0 9px}.fill{height:100%;width:38%;background:linear-gradient(90deg,#8faec5,#e6f1f7);border-radius:20px}.levels{display:flex;justify-content:space-between;color:#c7d6e1;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:17px;min-height:110px}.tile h3{font-size:15px;margin:10px 0 4px}.tile p{font-size:11px;color:#c4d3df;margin:0}.field{width:100%;padding:12px;border:1px solid #b9ccda66;border-radius:11px;background:#0b183177;color:#fff;outline:none;margin:6px 0}.field::placeholder{color:#c6d5df99}textarea.field{min-height:170px;resize:vertical;line-height:1.9}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:linear-gradient(120deg,#e8f0f4,#b9cfdf);color:#152541;border:0;font-weight:bold}.soft{font-size:12px}.list{display:grid;gap:8px;margin-top:12px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#dceaf40b;display:flex;gap:10px;align-items:center;justify-content:space-between}.item small{display:block;color:#bfd0dc;font-size:10px;margin-top:4px}.tag{font-size:10px;color:#d7e5ee;border:1px solid var(--line);padding:4px 8px;border-radius:20px}.paper{border:1px solid #dceaf455;border-radius:16px;padding:14px;background:linear-gradient(145deg,#e9f5fb18,#dceaf408);box-shadow:inset 0 0 35px #dceaf414}.paper .field{background:transparent;border:0;border-radius:0}.paper .titlefield{border-bottom:1px solid var(--line);font-weight:bold;font-size:17px}.empty{color:#c0d0dc;font-size:12px;padding:12px}.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.book{min-height:140px;padding:12px;border-radius:12px;background:linear-gradient(145deg,#f5f0e6,#d7e2e9);color:#1b2d50}.book strong{display:block;margin-top:28px}.lock{max-width:430px;margin:9vh auto;padding:28px;text-align:center}.gate{width:116px;height:116px;border:2px solid #c9d9e5;border-radius:50%;margin:4px auto 20px;display:grid;place-items:center;box-shadow:0 0 0 8px #d9e9f018,0 0 35px #b9d8f044;font-size:38px}.ring{display:flex;justify-content:center;gap:10px;margin:18px}.ring span{width:42px;height:42px;border:1px solid #b7cbd9;border-radius:50%;display:grid;place-items:center}.foot{text-align:center;color:#9fb2c2;font-size:10px;margin:20px 0}.hide{display:none!important}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.navbtn{text-align:center;font-size:11px;padding:9px 4px}.grid{gap:9px}.panel{padding:14px}.shell{padding:13px}.hero h1{font-size:18px}}
</style></head>
<body><div class="snow"></div>
<div id="lock" class="shell"><div class="top"><div class="logo">MY SPACE</div><span class="tag">THE SECRET GATE</span></div><div class="panel lock"><div class="gate">✧</div><h2 style="font:23px Georgia;letter-spacing:3px">THE SECRET GATE</h2><p class="muted">دروازه‌ی فضای شخصی تو</p><div class="ring"><span>☾</span><span>✦</span><span>✧</span></div><input id="pin" class="field" type="password" placeholder="رمز ورود آزمایشی"><button class="btn" style="width:100%;margin-top:8px" onclick="enterApp()">باز کردن دروازه</button><p class="muted" style="font-size:10px;margin-top:14px">نسخه‌ی آزمایشی: رمز ورود در این نسخه قفل امنیتی رمزنگاری‌شده نیست. برای شروع، هر رمزی وارد کن.</p></div></div>
<div id="app" class="shell hide">
<header class="top"><div class="logo">MY SPACE</div><div class="topright"><button class="iconbtn" onclick="show('corner')" title="My Corner">✧</button><button class="iconbtn" onclick="lockApp()" title="قفل">⌑</button></div></header>
<div class="layout"><aside class="sidebar" id="nav">
<button class="navbtn active" data-page="home" onclick="show('home')">⌂ خانه</button>
<button class="navbtn" data-page="planning" onclick="show('planning')">❄ برنامه‌ریزی</button>
<button class="navbtn" data-page="notes" onclick="show('notes')">✎ یادداشت‌ها</button>
<button class="navbtn" data-page="tasks" onclick="show('tasks')">✓ کارهای من</button>
<button class="navbtn" data-page="english" onclick="show('english')">✧ پیشرفت انگلیسی</button>
<button class="navbtn" data-page="library" onclick="show('library')">▤ کتابخانه</button>
<button class="navbtn" data-page="wallpaper" onclick="show('wallpaper')">❆ استودیوی والپیپر</button>
<button class="navbtn" data-page="corner" onclick="show('corner')">♡ گوشه‌ی من</button>
<button class="navbtn" data-page="settings" onclick="show('settings')">⚙ تنظیمات</button>
</aside><main class="main" id="main"></main></div>
<div class="foot">MY SPACE · نمونه‌ی اولیه‌ی یکپارچه · ذخیره‌ی محلی روی همین مرورگر</div></div>
<script>
const KEY='my_space_v01';let db={tasks:[],plans:[],notes:[],books:[],corner:[],wall:[],level:38,settings:{snow:true}};try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let page='home',last='home';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function enterApp(){if(!document.getElementById('pin').value){document.getElementById('pin').focus();return}document.getElementById('lock').classList.add('hide');document.getElementById('app').classList.remove('hide');show(last)}
function lockApp(){last=page;document.getElementById('app').classList.add('hide');document.getElementById('lock').classList.remove('hide');document.getElementById('pin').value=''}
function show(p){page=p;last=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const root=document.getElementById('main');const views={
home:`<div class="hero"><div><h1>فضای تو، با ریتم خودت</h1><div class="muted">خوش برگشتی به فضای شخصی‌ات</div></div><span class="tag">WINTER EDITION</span></div><section class="panel"><h3>مسیر یادگیری انگلیسی</h3><div class="muted">پیشرفت کلی · از A1 تا C2</div><div class="chart"><div class="fill" style="width:${db.level}%"></div></div><div class="levels"><span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span></div><div class="row" style="margin-top:15px"><button class="soft" onclick="show('english')">جزئیات پیشرفت</button></div></section><div class="grid"><div class="panel tile" onclick="show('planning')">❄<h3>برنامه‌ریزی</h3><p>تکالیف و امتحان‌ها</p></div><div class="panel tile" onclick="show('notes')">✎<h3>یادداشت‌ها</h3><p>روی شیشه‌ی بخارگرفته</p></div><div class="panel tile" onclick="show('tasks')">✓<h3>کارهای من</h3><p>کارهای روزانه و شخصی</p></div><div class="panel tile" onclick="show('library')">▤<h3>کتابخانه</h3><p>کتاب‌ها و نقل‌قول‌ها</p></div></div>`,
notes:`<div class="hero"><div><h1>یادداشت‌ها</h1><div class="muted">Foggy Glass Notes · نوشته‌هایت روی بخار شیشه</div></div><button class="btn" onclick="add('notes')">＋ یادداشت جدید</button></div><div class="panel"><input id="noteSearch" class="field" placeholder="جست‌وجو…" oninput="renderNotes()"><div id="noteList"></div><div class="paper" style="margin-top:12px"><input id="nt" class="field titlefield" placeholder="عنوان یادداشت…" oninput="editNote()"><textarea id="nb" class="field" placeholder="اینجا بنویس… انگار روی بخار شیشه می‌نویسی." oninput="editNote()"></textarea><div class="row"><button class="soft" onclick="addLink()">افزودن لینک</button><button class="soft" onclick="document.getElementById('notePhoto').click()">افزودن عکس</button><input id="notePhoto" type="file" accept="image/*" hidden onchange="attachPhoto(event)"><span id="noteStatus" class="muted">ذخیره‌ی خودکار</span></div><div id="noteAttach" class="muted"></div></div></div>`,
tasks:`<div class="hero"><div><h1>کارهای من</h1><div class="muted">کارهای امروز، فردا و بعداً</div></div></div><div class="panel"><div class="row"><input id="taskText" class="field" style="flex:1;min-width:150px" placeholder="یک کار جدید بنویس…"><select id="taskWhen" class="field" style="width:auto"><option>امروز</option><option>فردا</option><option>بعداً</option></select><select id="taskCat" class="field" style="width:auto"><option>شخصی</option><option>درسی</option><option>زبان</option><option>سرگرمی</option></select><button class="btn" onclick="addTask()">افزودن</button></div><div id="taskList" class="list"></div><div class="muted" id="taskProgress"></div></div>`,
planning:`<div class="hero"><div><h1>برنامه‌ریزی</h1><div class="muted">تکالیف، امتحان‌ها و کارهای مدرسه</div></div></div><div class="panel"><div class="row"><input id="planText" class="field" style="flex:1;min-width:150px" placeholder="مثلاً تمرین صفحه‌ی ۴۲ علوم"><select id="planType" class="field" style="width:auto"><option>تکلیف</option><option>امتحان</option><option>یادآوری</option></select><select id="planSubject" class="field" style="width:auto"><option>ریاضی</option><option>علوم</option><option>انگلیسی</option><option>فارسی</option><option>مطالعات</option><option>دینی</option><option>سایر</option></select><input id="planDate" type="date" class="field" style="width:auto"><button class="btn" onclick="addPlan()">ثبت</button></div><div id="planList" class="list"></div></div>`,
english:`<div class="hero"><div><h1>پیشرفت انگلیسی</h1><div class="muted">مسیر شخصی تو از A1 تا C2</div></div></div><div class="panel"><h3>درصد پیشرفت کلی</h3><div class="chart"><div class="fill" style="width:${db.level}%"></div></div><div class="row"><input id="levelRange" type="range" min="0" max="100" value="${db.level}" style="flex:1" oninput="setLevel(this.value)"><strong id="levelVal">${db.level}%</strong></div><p class="muted">جزئیات هر مهارت را می‌توانی جداگانه تکمیل کنی.</p>${['واژگان','گرامر','Speaking','Listening','Reading','Writing'].map(x=>`<div class="item"><span>${x}</span><span class="tag">قابل تنظیم در نسخه‌ی بعدی</span></div>`).join('')}</div>`,
library:`<div class="hero"><div><h1>کتابخانه‌ی من</h1><div class="muted">پرونده‌ی کتاب‌ها و داستان‌ها</div></div></div><div class="panel"><div class="row"><input id="bookTitle" class="field" style="flex:1" placeholder="نام کتاب"><input id="bookAuthor" class="field" style="flex:1" placeholder="نویسنده"><button class="btn" onclick="addBook()">افزودن کتاب</button></div><div id="bookList" class="bookgrid"></div></div>`,
corner:`<div class="hero"><div><h1>گوشه‌ی من</h1><div class="muted">فضای شخصی برای خاطره‌ها، ایده‌ها و چیزهای دلخواهت</div></div></div><div class="panel"><div class="row"><input id="cornerText" class="field" style="flex:1" placeholder="چیزی برای نگه‌داشتن…"><button class="btn" onclick="addCorner()">ذخیره</button></div><div id="cornerList" class="list"></div></div>`,
wallpaper:`<div class="hero"><div><h1>استودیوی والپیپر</h1><div class="muted">عکس دلخواهت را از گوشی انتخاب کن</div></div></div><div class="panel"><input type="file" accept="image/*" class="field" id="wallFile" onchange="addWall(event)"><div id="wallList" class="grid"></div></div>`,
settings:`<div class="hero"><div><h1>تنظیمات</h1><div class="muted">تنظیمات پایه‌ی نمونه‌ی اولیه</div></div></div><div class="panel"><div class="item"><span>ذخیره‌سازی</span><span class="tag">محلی روی همین مرورگر</span></div><div class="item"><span>تم برنامه</span><span class="tag">زمستانی · سرمه‌ای و یخی</span></div><div class="item"><span>قفل خودکار</span><span class="tag">در نسخه‌ی بعدی</span></div><p class="muted">این نسخه برای آزمایش چیدمان و کارکردهای پایه است؛ قفل رمزنگاری‌شده، رمز جداگانه‌ی بخش‌ها، بازیابی اطلاعات و برخی قابلیت‌های پیشرفته هنوز پیاده‌سازی نشده‌اند.</p><button class="soft" onclick="exportData()">خروجی گرفتن از داده‌ها (JSON)</button></div>`
};root.innerHTML=views[p]||views.home;if(p==='notes')initNotes();if(p==='tasks')renderTasks();if(p==='planning')renderPlans();if(p==='library')renderBooks();if(p==='corner')renderCorner();if(p==='wallpaper')renderWalls()}
function add(type){if(type==='notes'){db.notes.unshift({id:Date.now(),title:'',body:'',links:[],photos:[]});save();show('notes');document.getElementById('nt').focus()}}
let noteId=null;function initNotes(){if(!db.notes.length)add('notes');else{noteId=db.notes[0].id;loadNote()}renderNotes()}
function loadNote(){let n=db.notes.find(x=>x.id===noteId);if(!n)return;document.getElementById('nt').value=n.title;document.getElementById('nb').value=n.body;document.getElementById('noteAttach').textContent=[...(n.links||[]),...(n.photos||[]).map(x=>'عکس: '+x.name)].join(' · ')}
function editNote(){let n=db.notes.find(x=>x.id===noteId);if(!n)return;n.title=document.getElementById('nt').value;n.body=document.getElementById('nb').value;save();document.getElementById('noteStatus').textContent='ذخیره شد ✓';renderNotes()}
function renderNotes(){let el=document.getElementById('noteList');if(!el)return;let q=(document.getElementById('noteSearch')?.value||'').toLowerCase();el.innerHTML='';db.notes.filter(n=>(n.title+n.body).toLowerCase().includes(q)).forEach(n=>{let b=document.createElement('button');b.className='soft';b.textContent=n.title||'یادداشت بدون عنوان';b.style.margin='4px';b.onclick=()=>{noteId=n.id;loadNote()};el.append(b)})}
function addLink(){let n=db.notes.find(x=>x.id===noteId);let u=prompt('لینک را وارد کن:');if(!n||!u)return;try{let x=new URL(u);if(!['https:','http:'].includes(x.protocol))throw 0;n.links.push(x.href);save();loadNote()}catch(e){alert('لینک معتبر وارد کن.')}}
function attachPhoto(e){let f=e.target.files[0],n=db.notes.find(x=>x.id===noteId);if(!f||!n)return;if(f.size>900000){alert('در این نسخه عکس باید کمتر از ۹۰۰ کیلوبایت باشد.');return}let r=new FileReader();r.onload=()=>{n.photos.push({name:f.name,data:r.result});save();loadNote()};r.readAsDataURL(f)}
function addTask(){let t=document.getElementById('taskText').value.trim();if(!t)return;db.tasks.push({id:Date.now(),text:t,when:document.getElementById('taskWhen').value,cat:document.getElementById('taskCat').value,done:false});save();renderTasks();document.getElementById('taskText').value=''}
function renderTasks(){let el=document.getElementById('taskList');if(!el)return;el.innerHTML='';['امروز','فردا','بعداً'].forEach(w=>{let group=db.tasks.filter(t=>t.when===w);if(group.length){let h=document.createElement('div');h.className='muted';h.textContent=w;el.append(h);group.forEach(t=>{let d=document.createElement('div');d.className='item';let l=document.createElement('label');let c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.onchange=()=>{t.done=c.checked;save();renderTasks()};l.append(c,document.createTextNode(' '+t.text));let s=document.createElement('span');s.className='tag';s.textContent=t.cat;let del=document.createElement('button');del.className='soft';del.textContent='×';del.onclick=()=>{db.tasks=db.tasks.filter(x=>x.id!==t.id);save();renderTasks()};d.append(l,s,del);el.append(d)})}});let done=db.tasks.filter(t=>t.done).length;document.getElementById('taskProgress').textContent=`پیشرفت: ${done} از ${db.tasks.length} کار انجام شده`}
function addPlan(){let t=document.getElementById('planText').value.trim();if(!t)return;db.plans.push({id:Date.now(),text:t,type:document.getElementById('planType').value,subject:document.getElementById('planSubject').value,date:document.getElementById('planDate').value,done:false});save();renderPlans();document.getElementById('planText').value=''}
function renderPlans(){let el=document.getElementById('planList');if(!el)return;el.innerHTML='';db.plans.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(p=>{let d=document.createElement('div');d.className='item';let l=document.createElement('label');let c=document.createElement('input');c.type='checkbox';c.checked=p.done;c.onchange=()=>{p.done=c.checked;save();renderPlans()};l.append(c,document.createTextNode(' '+p.text));let s=document.createElement('span');s.className='tag';s.textContent=`${p.type} · ${p.subject} · ${p.date||'بدون تاریخ'}`;d.append(l,s);el.append(d)})}
function setLevel(v){db.level=+v;save();document.getElementById('levelVal').textContent=v+'%';document.querySelector('#main .fill').style.width=v+'%'}
function addBook(){let t=document.getElementById('bookTitle').value.trim();if(!t)return;db.books.push({title:t,author:document.getElementById('bookAuthor').value});save();renderBooks()}
function renderBooks(){let el=document.getElementById('bookList');if(!el)return;el.innerHTML='';db.books.forEach(b=>{let d=document.createElement('div');d.className='book';let s=document.createElement('strong');s.textContent=b.title;let a=document.createElement('small');a.textContent=b.author||'';d.append(s,a);el.append(d)})}
function addCorner(){let t=document.getElementById('cornerText').value.trim();if(!t)return;db.corner.unshift(t);save();renderCorner();document.getElementById('cornerText').value=''}
function renderCorner(){let el=document.getElementById('cornerList');if(!el)return;el.innerHTML='';db.corner.forEach(t=>{let d=document.createElement('div');d.className='item';d.textContent=t;el.append(d)})}
function addWall(e){let f=e.target.files[0];if(!f)return;if(f.size>1000000){alert('در این نسخه تصویر باید کمتر از ۱ مگابایت باشد.');return}let r=new FileReader();r.onload=()=>{db.wall.push({name:f.name,data:r.result});save();renderWalls()};r.readAsDataURL(f)}
function renderWalls(){let el=document.getElementById('wallList');if(!el)return;el.innerHTML='';db.wall.forEach(w=>{let d=document.createElement('div');d.className='panel';let im=document.createElement('img');im.src=w.data;im.style.width='100%';im.style.borderRadius='12px';let tx=document.createElement('div');tx.className='muted';tx.textContent=w.name;d.append(im,tx);el.append(d)})}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-space-backup.json';a.click();URL.revokeObjectURL(a.href)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
